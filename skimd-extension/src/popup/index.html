<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skimd</title>
    <!--
      Pre-React theme bootstrap — eliminates the white flash on popup open.

      The flash occurs because:
        1. The popup viewport is transparent until the browser paints a frame.
        2. React only mounts after the JS bundle parses (~1-3 frames).
        3. #root has no background until React/Tailwind apply dark: classes.

      Three independent layers each close a different part of the gap:

      LAYER 1 — <style> (fires at HTML parse time, before any JS):
        Sets background-color: #0f0f0f on html + body immediately.
        Guarantees the document canvas is never white during JS startup.

      LAYER 2 — inline style on <div id="root"> (fires at element parse time):
        #root (overflow:hidden; flex) sits on top of body and can paint
        white independently. Giving it an explicit inline background ensures
        the stacking context is dark from the very first paint. This is the
        most direct fix for the flash — it targets the exact element that
        was causing the white bleed.

      LAYER 3 — inline <script> (fires synchronously in <head>):
        Reads chrome.storage.sync asynchronously and, once resolved,
        applies the correct theme to html, body, AND #root together.
        If light theme is stored, all three surfaces are corrected to
        #ffffff before React paints its first frame.

      Note: chrome.storage.sync.get() has no synchronous path — it is always
      async. Layers 1 and 2 handle the pre-callback window (dark default).
      Layer 3 corrects the rare case where a light-theme user sees a brief
      dark flash — acceptable; dark→light is far less jarring than light→dark
      (white flash) for the common dark-mode user.
    -->

    <!-- LAYER 1: instant dark canvas before any JS runs -->
    <style>
      html, body {
        background-color: #0f0f0f;  /* --color-brand-dark-bg */
      }
    </style>

    <!-- LAYER 3: resolve stored theme and apply to all three paint surfaces -->
    <script>
      (function () {
        var DARK_BG     = '#0f0f0f';
        var LIGHT_BG    = '#ffffff';
        var STORAGE_KEY = 'themeOverride';
        var htmlEl      = document.documentElement;

        /**
         * applyTheme — sets background on html, body, and optionally #root,
         * and toggles the `dark` class on <html>.
         *
         * #root is not in the DOM when this runs from <head>, so rootEl is
         * null on the first call. The DOMContentLoaded listener below passes
         * the real element once the body has parsed.
         */
        function applyTheme(theme, rootEl) {
          var bg     = (theme === 'light') ? LIGHT_BG : DARK_BG;
          var isDark = (theme !== 'light');

          /* Toggle class-based dark variant (Tailwind `dark:` utilities) */
          if (isDark) {
            htmlEl.classList.add('dark');
          } else {
            htmlEl.classList.remove('dark');
          }

          /* Paint all three surfaces */
          htmlEl.style.backgroundColor = bg;
          if (document.body) document.body.style.backgroundColor = bg;
          if (rootEl)        rootEl.style.backgroundColor         = bg;
        }

        /* ── Phase 1: apply system preference synchronously ────────────────
         * Runs before any paint. Reinforces the dark <style> fallback, or
         * overrides to light if the OS prefers light and no stored value
         * exists yet.
         */
        var prefersDark = window.matchMedia
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : true; /* safe dark default if matchMedia is unavailable */

        applyTheme(prefersDark ? 'dark' : 'light', null);

        /* ── Phase 2: resolve stored user override (async) ─────────────────
         * Fires the chrome.storage read immediately so the callback races
         * against React as early as possible. rootEl is null here because
         * <body> hasn't been parsed yet.
         */
        function resolveStoredTheme(rootEl) {
          try {
            if (typeof chrome !== 'undefined' &&
                chrome.storage && chrome.storage.sync) {
              chrome.storage.sync.get(STORAGE_KEY, function (result) {
                var stored = result && result[STORAGE_KEY];
                if (stored === 'light' || stored === 'dark') {
                  applyTheme(stored, rootEl);
                }
                /* No stored value → Phase 1 system-preference is correct. */
              });
            }
          } catch (e) {
            /* Not in an extension context (e.g. local dev preview) — no-op. */
          }
        }

        /* Fire immediately (rootEl = null; body not yet parsed). */
        resolveStoredTheme(null);

        /* Fire again after DOM is ready so #root gets the correct bg even if
         * the storage callback resolves after DOMContentLoaded. */
        document.addEventListener('DOMContentLoaded', function () {
          var rootDiv = document.getElementById('root');
          resolveStoredTheme(rootDiv);
        }, { once: true });
      })();
    </script>
  </head>
  <body>
    <!--
      LAYER 2: #root gets an explicit dark background as an inline style
      attribute. This fires at HTML element parse time — earlier than any
      script tag in <head> executes and earlier than global.css (which loads
      after Vite injects its <link> tag). The inline style ensures #root is
      never white during the React boot window.

      The script above corrects this to #ffffff if light theme is stored.
    -->
    <div id="root" style="background-color: #0f0f0f"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
